name: Research incident submission

on:
  issues:
    types: [opened]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  research:
    if: contains(github.event.issue.labels.*.name, 'incident-submission')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Extract link and notes from issue
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || "";
            const url = (body.match(/https?:\/\/[^\s)>\]]+/) || [])[0] || "";
            const notesMatch = body.split(/### What happened/i)[1] || "";
            const notes = notesMatch.replace(/_No response_/,'').trim().slice(0, 500);
            core.setOutput("url", url);
            core.setOutput("notes", notes);
            if (!url) core.setFailed("No URL found in the issue body.");

      - name: Research the link
        id: research
        run: |
          set +e
          OUTPUT=$(node scraper/research.mjs "${{ steps.parse.outputs.url }}" --notes "${{ steps.parse.outputs.notes }}" 2>&1)
          CODE=$?
          echo "$OUTPUT"
          {
            echo "log<<EOF"
            echo "$OUTPUT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          exit $CODE

      - name: Open PR with the drafted candidate
        if: success()
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "submission: candidate from issue #${{ github.event.issue.number }}"
          title: "Incident submission #${{ github.event.issue.number }}: research results"
          body: |
            Drafted from ${{ steps.parse.outputs.url }} (issue #${{ github.event.issue.number }}).

            ```
            ${{ steps.research.outputs.log }}
            ```

            Review `scraper/candidates.json`, verify casualty and accountability facts, then promote
            into `data/incidents.js` and mark the candidate `accepted`.
          branch: submission/issue-${{ github.event.issue.number }}
          add-paths: scraper/candidates.json

      - name: Report back on the issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const ok = "${{ steps.research.outcome }}" === "success";
            const log = `${{ steps.research.outputs.log }}`;
            const body = ok
              ? `Thanks — the link was researched automatically:\n\n\`\`\`\n${log}\n\`\`\`\nA pull request with the drafted entry has been opened for editorial review.`
              : `The automated research could not process this link:\n\n\`\`\`\n${log}\n\`\`\`\nA maintainer will take a look.`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body
            });
